openapi: 3.0.3
info:
  description: API for submitting mailing jobs with various document routing options
  title: C2M API v2
  version: 2.0.0
servers:
- description: Production server
  url: https://api.click2mail.com/v2
security:
- bearerAuth: []
tags:
- description: Job submission endpoints
  name: jobs
- description: Authentication and token management endpoints
  name: auth
paths:
  /jobs/submit/single/doc:
    post:
      description: "Submits a mailing job (single doc). The request body contains\
        \ job parameters including document source, recipient address information,\
        \ and payment details."
      operationId: submitSingleDocParams
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/submitSingleDocParams"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/standardResponse"
          description: Success
        "400":
          content:
            application/json:
              examples:
                example-1:
                  value:
                    errorType: ValidationError
                    errorMessage: Missing required field in request
                    errorCode: MISSING_REQUIRED_FIELD
                    errorDetails: "{\"field\": \"docSourceAll\", \"location\": \"\
                      requestBody\"}"
                    errorTrackingId: TRK-20260907-Q320XK
                example-2:
                  value:
                    errorType: ValidationError
                    errorMessage: Invalid oneOf field value
                    errorCode: INVALID_ONEOF
                    errorDetails: "{\"field\": \"docSourceAll\", \"issue\": \"exactly\
                      \ one variant must be provided\"}"
                    errorTrackingId: TRK-20260907-IXF1HH
                example-3:
                  value:
                    errorType: ValidationError
                    errorMessage: Malformed JSON in request body
                    errorCode: INVALID_JSON
                    errorDetails: "{\"error\": \"unexpected token at position 42\"\
                      }"
                    errorTrackingId: TRK-20260907-ZBPUP9
              schema:
                $ref: "#/components/schemas/errorResponse"
          description: Bad Request - Invalid request parameters
        "401":
          content:
            application/json:
              examples:
                example-1:
                  value:
                    errorType: AuthenticationError
                    errorMessage: Authorization header is missing or invalid
                    errorCode: MISSING_AUTH_HEADER
                    errorDetails: "{\"expected\": \"Bearer <token>\", \"received\"\
                      : \"none\"}"
                    errorTrackingId: TRK-20260907-DVBF4R
                example-2:
                  value:
                    errorType: AuthenticationError
                    errorMessage: Authentication token is invalid
                    errorCode: INVALID_TOKEN
                    errorDetails: "{\"issue\": \"token signature verification failed\"\
                      }"
                    errorTrackingId: TRK-20260907-JGDJZM
                example-3:
                  value:
                    errorType: AuthenticationError
                    errorMessage: Authentication token has expired
                    errorCode: EXPIRED_TOKEN
                    errorDetails: "{\"expiresAt\": \"2026-02-15T10:30:00Z\", \"currentTime\"\
                      : \"2026-02-16T14:00:00Z\"}"
                    errorTrackingId: TRK-20260907-JGHSCC
              schema:
                $ref: "#/components/schemas/errorResponse"
          description: Unauthorized - Missing or invalid authentication
        "403":
          content:
            application/json:
              examples:
                example-1:
                  value:
                    errorType: AuthorizationError
                    errorMessage: Insufficient permissions to access this resource
                    errorCode: INSUFFICIENT_PERMISSIONS
                    errorDetails: "{\"required\": \"jobs:write\", \"provided\": \"\
                      jobs:read\"}"
                    errorTrackingId: TRK-20260907-X6SIE8
                example-2:
                  value:
                    errorType: AuthorizationError
                    errorMessage: Account has been suspended
                    errorCode: ACCOUNT_SUSPENDED
                    errorDetails: "{\"reason\": \"billing overdue\", \"contactSupport\"\
                      : \"support@click2mail.com\"}"
                    errorTrackingId: TRK-20260907-39ZQ4V
              schema:
                $ref: "#/components/schemas/errorResponse"
          description: Forbidden - Insufficient permissions
        "404":
          content:
            application/json:
              examples:
                example-1:
                  value:
                    errorType: ResourceNotFoundError
                    errorMessage: Job not found
                    errorCode: JOB_NOT_FOUND
                    errorDetails: "{\"jobId\": \"JOB-12345\"}"
                    errorTrackingId: TRK-20260907-2GIXBF
                example-2:
                  value:
                    errorType: ResourceNotFoundError
                    errorMessage: Requested resource does not exist
                    errorCode: RESOURCE_NOT_FOUND
                    errorDetails: "{\"resourceType\": \"document\", \"resourceId\"\
                      : \"DOC-67890\"}"
                    errorTrackingId: TRK-20260907-P21KLG
              schema:
                $ref: "#/components/schemas/errorResponse"
          description: Not Found - Resource not found
        "422":
          content:
            application/json:
              examples:
                example-1:
                  value:
                    errorType: ValidationError
                    errorMessage: Invalid enum value provided
                    errorCode: INVALID_ENUM_VALUE
                    errorDetails: "{\"field\": \"docSourceAll\", \"value\": \"invalid_value\"\
                      , \"allowedValues\": [\"pdf\", \"doc\", \"docx\"]}"
                    errorTrackingId: TRK-20260907-WO5971
                example-2:
                  value:
                    errorType: ValidationError
                    errorMessage: Mutually exclusive fields both present
                    errorCode: MUTUAL_EXCLUSION_VIOLATION
                    errorDetails: "{\"fields\": [\"jobTemplate\", \"jobOptions\"],\
                      \ \"issue\": \"only one may be provided\"}"
                    errorTrackingId: TRK-20260907-RAKP9U
                example-3:
                  value:
                    errorType: ValidationError
                    errorMessage: Field format validation failed
                    errorCode: INVALID_FORMAT
                    errorDetails: "{\"errors\": [{\"field\": \"docSourceAll\", \"\
                      issue\": \"not found in document library\"}, {\"field\": \"\
                      recipientAddressSource.postalCode\", \"issue\": \"invalid format\
                      \ - must be 5 or 9 digits\"}]}"
                    errorTrackingId: TRK-20260907-3E87GI
              schema:
                $ref: "#/components/schemas/errorResponse"
          description: Unprocessable Entity - Validation failed
        "500":
          content:
            application/json:
              examples:
                example-1:
                  value:
                    errorType: ServerError
                    errorMessage: Internal server error occurred
                    errorCode: SERVER_ERROR
                    errorDetails: "{\"message\": \"An unexpected error occurred\"}"
                    errorTrackingId: TRK-20260907-5IKK3R
                example-2:
                  value:
                    errorType: ServerError
                    errorMessage: Database error occurred
                    errorCode: DATABASE_ERROR
                    errorDetails: "{\"operation\": \"insert\", \"table\": \"jobs\"\
                      }"
                    errorTrackingId: TRK-20260907-N89UAG
                example-3:
                  value:
                    errorType: ServerError
                    errorMessage: External service error
                    errorCode: EXTERNAL_SERVICE_ERROR
                    errorDetails: "{\"service\": \"payment-gateway\", \"status\":\
                      \ \"timeout\"}"
                    errorTrackingId: TRK-20260907-YY86UF
              schema:
                $ref: "#/components/schemas/errorResponse"
          description: Internal Server Error - Server encountered an error
      summary: Submit a single doc job
      tags:
      - jobs
      x-content-type: application/json
      x-accepts:
      - application/json
