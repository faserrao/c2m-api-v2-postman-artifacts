        expires_at:
          description: ISO 8601 timestamp of expiration
          format: date-time
          type: string
        scopes:
          description: Granted scopes
          items:
            type: string
          type: array
        token_id:
          description: Server-issued identifier for this token
          type: string
      required:
      - access_token
      - expires_at
      - expires_in
      - token_type
      type: object
