    ShortTokenRequest:
      additionalProperties: false
      example:
        long_token: long_token
        scopes:
        - scopes
        - scopes
      properties:
        long_token:
          description: Optional if the long-term token is provided in Authorization
            header
          type: string
        scopes:
          description: Optional scope narrowing; defaults to the long-term token's
            scopes
          items:
            type: string
          type: array
      type: object
    ShortTokenResponse:
      example:
        access_token: access_token
        expires_at: 2000-01-23T04:56:07.000+00:00
        token_id: token_id
        scopes:
        - scopes
        - scopes
        token_type: Bearer
        expires_in: 0
      properties:
        token_type:
          enum:
          - Bearer
          type: string
        access_token:
          description: Short-lived JWT
          type: string
        expires_in:
          description: "Lifetime in seconds (e.g., 900 for 15 minutes)"
          type: integer
        expires_at:
          description: ISO 8601 timestamp of expiration
          format: date-time
          type: string
        scopes:
          description: Granted scopes
          items:
            type: string
          type: array
        token_id:
          description: Server-issued identifier for this token
          type: string
      required:
      - access_token
      - expires_at
      - expires_in
      - token_type
      type: object
    LongTokenRequest:
      additionalProperties: false
      description: One of several credential mechanisms must be provided.
      example:
        grant_type: client_credentials
        ttl_seconds: 626035
        assertion: assertion
        client_secret: client_secret
        scopes:
        - scopes
        - scopes
        otp_code: otp_code
        client_id: client_id
        assertion_type: assertion_type
      properties:
        grant_type:
          description: The authentication grant type
          enum:
          - client_credentials
          - assertion
          type: string
        client_id:
          description: Client identifier issued by Click2Mail
          type: string
        client_secret:
          description: Required if using client_credentials with secret
          type: string
        otp_code:
          description: Required if your policy mandates OTP for issuance
          type: string
        assertion_type:
          description: Required when grant_type=assertion
          type: string
        assertion:
          description: Signed JWT or other accepted assertion
          type: string
        scopes:
          description: Scopes to assign to the long-term token
          items:
            type: string
          type: array
        ttl_seconds:
          description: Requested lifetime (1 hour - 90 days). Server may clamp.
          maximum: 7776000
          minimum: 3600
          type: integer
      required:
      - client_id
      - grant_type
      type: object
