openapi: 3.0.3
info:
  title: C2M API v2
  version: 2.0.0
  description: API for submitting mailing jobs with various document routing options
  x-http-error-map:
    '400':
      errorType: ValidationError
      errorCodes:
        - MISSING_REQUIRED_FIELD
        - INVALID_ONEOF
        - INVALID_JSON
    '401':
      errorType: AuthenticationError
      errorCodes:
        - MISSING_AUTH_HEADER
        - INVALID_TOKEN
        - EXPIRED_TOKEN
    '403':
      errorType: AuthorizationError
      errorCodes:
        - INSUFFICIENT_PERMISSIONS
        - ACCOUNT_SUSPENDED
    '404':
      errorType: ResourceNotFoundError
      errorCodes:
        - JOB_NOT_FOUND
        - RESOURCE_NOT_FOUND
    '422':
      errorType: ValidationError
      errorCodes:
        - INVALID_ENUM_VALUE
        - MUTUAL_EXCLUSION_VIOLATION
        - INVALID_FORMAT
    '500':
      errorType: ServerError
      errorCodes:
        - SERVER_ERROR
        - DATABASE_ERROR
        - EXTERNAL_SERVICE_ERROR
servers:
  - url: https://9a6b3422-5316-48e1-a4ab-e5251321f3d6.mock.pstmn.io
    description: Postman Mock Server
  - url: 'https://api.click2mail.com/v2'
    description: Production server
tags:
  - name: jobs
    description: Job submission endpoints
  - name: auth
    description: Authentication and token management endpoints
components:
  schemas:
    month:
      type: integer
      minimum: 1
      maximum: 12
    submitSingleDocParams:
      type: object
      properties:
        jobTemplate:
